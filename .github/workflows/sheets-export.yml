name: Export Sheets data

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    name: Export and validate canonical data
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write Google service account credentials
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$GOOGLE_SERVICE_ACCOUNT_JSON" ]; then
            echo "GOOGLE_SERVICE_ACCOUNT_JSON repository secret is required." >&2
            exit 1
          fi
          credentials_path="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
          chmod 600 "$credentials_path"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"

      - name: Export canonical Sheet data
        run: pnpm sheets:export

      - name: Validate exported data
        run: pnpm data:validate

      - name: Upload export artifact
        uses: actions/upload-artifact@v7
        with:
          name: sheets-export
          path: tmp/sheets-export/
          if-no-files-found: error
